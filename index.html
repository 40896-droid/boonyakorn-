<!DOCTYPE html>
<html lang="th">
<head>
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

header{background-image:url(images/header.jpg);
	height:264px;
}
nav{background-color:red;height:400px;flex:1;}
article{background-color:#33FFFF;height:400px;flex:3;}
footer{
background-color:#00FFCC;height:100px;
text-align:center;
color:#eee;
}
section{display:flex;}
.container{width:1024px;margin:0 auto;}
a:link{
        color:green;
        text-decoration:none;
        background-color:#EBAC38;
        display:block;
        width:100%;
        padding:5px;
}
a:visited{
        color:pink;

}
a:hover{
        color:red;
        background-color:#92F58C;

}
a:active{
        color:blue;

}

</style>
<meta charset="utf-8">
<title>work8 html layout</title>
</head>
<body>
<div class="container">
<header></header>
<section>
<nav>
<ul style="list-style:none;">
<li><a href="">ทิวลิป (Tulip)</li>
<li><a href="">ลาเวนเดอร์ (Lavender)</li>
<li><a href="">กุหลาบ (Rose)</li>
<li><a href="">ซากุระ (Sakura)</li>
<li><a href="">พีโอนี (Peony)</li>
<li><a href="">ไฮเดรนเยีย (Hydrangea)</li>
</ul>

</nav>
<article></article>
</section>
<footer>
<p>จัดทำโดยนายบุณยกร เปลี่ยนขำ ชั้น ม.6/6 เลขที่ 7 <br>โรงเรียนรัตนราษฏร์บำรุง </P>
</footer>
</div>
</body>
</html>
